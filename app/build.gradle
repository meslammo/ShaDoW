plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.shadow.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'com.shadow.mobile'
        minSdk 26
        targetSdk 35
        versionCode 51
        versionName '1.0.0'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
    }

    // Chaquopy 17 + Gradle 8.10 task validation: make the Python merge phase
    // explicitly wait for the native metadata and Python requirements outputs.
    afterEvaluate {
        tasks.matching { it.name == 'mergeDebugPythonSources' || it.name == 'mergeReleasePythonSources' }.configureEach {
            dependsOn tasks.matching { it.name == 'mergeDebugNativeDebugMetadata' || it.name == 'mergeReleaseNativeReleaseMetadata' }
            dependsOn tasks.matching { it.name == 'installDebugPythonRequirements' || it.name == 'installReleasePythonRequirements' }
        }
    }
}

chaquopy {
    defaultConfig {
        version = '3.11'
    }
    sourceSets {
        main {
            // Repo root is the Python source root so the namespace package `shadow` resolves correctly.
            srcDirs = ['..']
        }
    }
}
