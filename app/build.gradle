plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.shadow.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'com.shadow.mobile'
        minSdk 26
        targetSdk 35
        versionCode 54
        versionName '1.2.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }
    buildTypes {
        release { minifyEnabled false; shrinkResources false; signingConfig signingConfigs.debug }
    }
    // MOD-19.16: Keep Chaquopy's source root limited to the Python tree.
    afterEvaluate {
        tasks.matching { it.name == 'mergeDebugPythonSources' || it.name == 'mergeReleasePythonSources' }.configureEach {
            dependsOn tasks.matching { it.name == 'javaPreCompileDebug' || it.name == 'javaPreCompileRelease' }
            dependsOn tasks.matching { it.name == 'mergeDebugNativeDebugMetadata' || it.name == 'mergeReleaseNativeReleaseMetadata' }
            dependsOn tasks.matching { it.name == 'installDebugPythonRequirements' || it.name == 'installReleasePythonRequirements' }
        }
    }
}

chaquopy {
    defaultConfig { version = '3.11' }
    sourceSets { main { srcDirs = ['../shadow'] } }
}
