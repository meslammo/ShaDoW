plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.shadow.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'com.shadow.mobile'
        minSdk 26
        targetSdk 35
        versionCode 50
        versionName '0.50.0'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }
}

chaquopy {
    defaultConfig {
        version = '3.11'
    }
    sourceSets {
        main {
            // Repo root is the Python source root so the namespace package `shadow` resolves correctly.
            srcDirs = ['..']
        }
    }
}
