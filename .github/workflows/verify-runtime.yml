name: Verify SHADOW Runtime
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['main']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e . pytest
      - name: Prepare isolated sandbox runtime
        run: |
          docker info --format '{{.ServerVersion}}'
          docker pull python:3.12.16-alpine3.24
          image_id="$(docker image inspect --format '{{.Id}}' python:3.12.16-alpine3.24)"
          echo "SHADOW_SANDBOX_IMAGE=$image_id" >> "$GITHUB_ENV"
      - name: Compile
        run: python -m compileall -q shadow
      - name: Tests
        run: pytest -q
