name: Verify SHADOW Runtime
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['main']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e . pytest
      - name: Prepare isolated sandbox runtime
        run: |
          docker info --format '{{.ServerVersion}}'
          docker pull python@sha256:e064671ca452259bab50e8e2c7bd896e39e9a343bb06ca25234adf6fe18d0fc7
          image_id="$(docker image inspect --format '{{.Id}}' python@sha256:e064671ca452259bab50e8e2c7bd896e39e9a343bb06ca25234adf6fe18d0fc7)"
          echo "SHADOW_SANDBOX_IMAGE=$image_id" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile Python runtime
        run: python -m compileall -q shadow
      - name: Python tests
        run: pytest -q -rs
      - name: Backend API adapter tests
        working-directory: backend
        run: npm test
