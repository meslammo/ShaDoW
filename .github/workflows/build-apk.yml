name: Build SHADOW APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'shadow/**'
      - 'backend/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'pyproject.toml'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'shadow/**'
      - 'backend/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'pyproject.toml'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check backend/server.mjs
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: python -m compileall -q shadow
      - run: gradle --no-daemon clean assembleRelease
      - run: test -s app/build/outputs/apk/release/app-release.apk
      - run: ${ANDROID_HOME}/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk
      - run: sha256sum app/build/outputs/apk/release/app-release.apk | tee app/build/outputs/apk/release/SHA256SUM.txt
      - run: unzip -l app/build/outputs/apk/release/app-release.apk | grep -E 'chaquopy|python|libpython|shadow_logo|ShadowCloudClient' | head -40
      - uses: actions/upload-artifact@v4
        with:
          name: SHADOW-v1.4.1-CLOUD-FIRST-FINAL-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/SHA256SUM.txt
          if-no-files-found: error
