name: Build SHADOW APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'shadow/**'
      - 'backend/**'
      - '.github/workflows/**'
      - 'AndroidManifest.xml'
      - 'activity_main.xml'
      - 'settings.gradle*'
      - 'build.gradle*'
      - 'gradle.properties'
jobs:
  verify-backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: backend/package.json }
      - run: npm install --ignore-scripts
      - run: node --check server.mjs
      - run: node --check ai-router.mjs
      - run: node --check tool-registry.mjs
      - run: node --check offline-engine.mjs
  build:
    needs: verify-backend
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Ensure Android SDK packages
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - run: gradle :app:clean :app:assembleRelease
      - run: test -f app/build/outputs/apk/release/app-release.apk
      - run: "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
      - run: sha256sum app/build/outputs/apk/release/app-release.apk | tee app/build/outputs/apk/release/apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: SHADOW-MOD73-FINAL-candidate-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/apk.sha256
