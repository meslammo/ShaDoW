name: Build SHADOW APK — SHADOW Wake / Online Only
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'shadow/**'
      - 'backend/**'
      - '.github/workflows/**'
      - 'AndroidManifest.xml'
      - 'activity_main.xml'
      - 'settings.gradle*'
      - 'build.gradle*'
      - 'gradle.properties'

jobs:
  verify-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify backend syntax
        working-directory: backend
        run: |
          npm install --ignore-scripts
          node --check server.mjs
          node --check ai-router.mjs
          node --check shadow-pipeline.mjs
          node --check external-providers.mjs
          node --check tool-registry.mjs
          node --check task-router.mjs
          node --check development-agent.mjs
          node --test test-external-providers.mjs
          node --test test-task-router.mjs
          node --test test-tool-governance.mjs
          node test-shadow-pipeline.mjs
          node test-client-cloud-e2e.mjs

  build:
    needs: verify-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e
          if [ -z "${ANDROID_HOME:-}" ]; then export ANDROID_HOME="$(find "$HOME" /usr/local -maxdepth 5 -type d -name sdk 2>/dev/null | head -n 1)"; fi
          test -n "$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Fetch wake-word model assets
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/assets
          BASE="https://raw.githubusercontent.com/Bwarhness/jarvis-assistant/17edf69264ae421d68a103cde1bc2c1dcab2f673/app/src/main/assets"
          SHADOW_BASE="https://raw.githubusercontent.com/jakes1345/ShadowCypher/827829b09399d6c02ba108607e70aa05bf7485a5/android/assistant/src/main/assets"
          curl -fL "$BASE/melspectrogram.onnx" -o app/src/main/assets/melspectrogram.onnx
          curl -fL "$BASE/embedding_model.onnx" -o app/src/main/assets/embedding_model.onnx
          curl -fL "$SHADOW_BASE/hey_shadow.onnx" -o app/src/main/assets/hey_shadow.onnx
          test -s app/src/main/assets/melspectrogram.onnx
          test -s app/src/main/assets/embedding_model.onnx
          test -s app/src/main/assets/hey_shadow.onnx
          sha256sum app/src/main/assets/*.onnx

      - name: Build release APK
        run: gradle :app:clean :app:test :app:assembleRelease
      - name: Verify APK
        shell: bash
        run: |
          set -e
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee app/build/outputs/apk/release/apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: SHADOW-MOD76-ONLINE-ONLY-candidate-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/apk.sha256

  real-provider-e2e:
    if: ${{ secrets.OPENAI_API_KEY != '' || secrets.XAI_API_KEY != '' || secrets.DEEPSEEK_API_KEY != '' || secrets.MISTRAL_API_KEY != '' || secrets.ANTHROPIC_API_KEY != '' || secrets.GEMINI_API_KEY != '' }}
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real online provider E2E
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            export SHADOW_E2E_PROVIDER=openai
          elif [ -n "${XAI_API_KEY:-}" ]; then
            export SHADOW_E2E_PROVIDER=xai
          elif [ -n "${DEEPSEEK_API_KEY:-}" ]; then
            export SHADOW_E2E_PROVIDER=deepseek
          elif [ -n "${MISTRAL_API_KEY:-}" ]; then
            export SHADOW_E2E_PROVIDER=mistral
          elif [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            export SHADOW_E2E_PROVIDER=anthropic
          else
            export SHADOW_E2E_PROVIDER=gemini
          fi
          npm install --ignore-scripts
          node test-real-provider-e2e.mjs
