name: SHADOW Real Online E2E

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - integration/150-online-brain-loop-2026-09-25

permissions:
  contents: read

jobs:
  real-online-e2e:
    runs-on: ubuntu-latest
    env:
      SHADOW_E2E_REAL: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install -e . pytest

      - name: Compile
        run: python -m compileall -q shadow

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cloud pipeline and client E2E
        working-directory: backend
        run: |
          npm install --ignore-scripts
          node test-shadow-pipeline.mjs
          node test-client-cloud-e2e.mjs

      - name: Real online provider E2E
        working-directory: backend
        env:
          SHADOW_E2E_PROVIDER: ${{ secrets.POLLINATIONS_API_KEY != '' && 'pollinations' || 'openai' }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node test-real-provider-e2e.mjs
