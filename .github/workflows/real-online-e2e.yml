name: SHADOW Real Online E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-online-e2e:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SHADOW_E2E_REAL: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install -e . pytest

      - name: Compile
        run: python -m compileall -q shadow

      - name: Real provider E2E
        run: pytest -q tests/test_online_brain_e2e.py -k real_online_brain_e2e
