services:
  - type: web
    name: shadow-cloud-api
    runtime: node
    repo: https://github.com/meslammo/ShaDoW.git
    branch: main
    rootDir: backend
    buildCommand: npm install --omit=dev
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-2.5-flare
      - key: SHADOW_STT_MODEL
        value: gpt-transcribe
      - key: SHADOW_TTS_MODEL
        value: gpt-4o-mini-tts
      - key: XAI_MODEL
        value: grok-4.6
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-pro
      - key: MISTRAL_MODEL
        value: mistral-medium-3-5
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: NODE_ENV
        value: production
