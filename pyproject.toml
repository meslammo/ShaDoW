[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="shadow-ai"
version="0.50.0"
description="SHADOW AI runtime — Super Nice 150-Core"
requires-python=">=3.11"

[tool.setuptools.packages.find]
include=["shadow*"]

[tool.pytest.ini_options]
pythonpath=["."]
testpaths=["tests"]
